<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE KAJOOR SQUARE CO. | Date Collection</title>
    <!-- Load Inter and Playfair Display Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        // =======================================================
        // 🔑 EDITABLE CONTENT CONFIGURATION (START)
        // Kept consistent across all files for easy management
        // NOTE: Added 'extra_details' field for the new product modal view.
        // =======================================================
        const config = {
            brand: {
                name: "THE KAJOOR SQUARE CO.",
                gold_part: "THE KAJOOR",
                black_part: "SQUARE CO.",
                established_year: "2012",
                address:  { 
                    text: "31 Dunrobin Crecent, Durban, South Africa", 
                    href: "https://maps.app.goo.gl/CG5K6uD8TDtB5QZ78" 
                }
            },
            // === INDIVIDUAL PRODUCT LISTINGS ===
            products: [
                { 
                    id: 1, 
                    name: "Majestic Medjool", 
                    unit_price: 49.99, 
                    description: "Large, soft, and naturally sweet. The King of Dates, perfect for a luxurious snack.", 
                    extra_details: "These are hand-picked from the finest groves in Jordan, offering a rich, caramel-like flavour and a satisfyingly chewy texture. They are non-GMO, naturally high in fiber, and packed with essential minerals like potassium and magnesium. Best stored in a cool, dry place.",
                    image_url: "https://www.secretosdelsur.com/wp-content/uploads/2024/05/dates.jpg" 
                },
                { 
                    id: 2, 
                    name: "Amber Delight", 
                    unit_price: 39.99, 
                    description: "A tender, golden variety with a delicate, syrupy flavour. Excellent for baking.", 
                    extra_details: "Known for their golden hue and semi-dry texture, the Amber Delight is exceptionally versatile. They come from the Al-Kharj region and are sun-dried to lock in their natural sweetness. A fantastic alternative to refined sugar in recipes.",
                    image_url: "https://cleangreensimple.com/wp-content/uploads/guide-to-dried-dates.jpg" 
                },
                { 
                    id: 3, 
                    name: "Black Pearl", 
                    unit_price: 45.00, 
                    description: "Rich, dark, and intensely flavourful, reminiscent of chocolate and coffee.", 
                    extra_details: "The Black Pearl variety is a rare, dark date with deep molasses undertones. They are highly sought after for their robust flavour profile, perfect for pairing with cheese or a post-dinner treat. They are grown organically and air-shipped to maintain peak freshness.",
                    image_url: "https://t3.ftcdn.net/jpg/02/76/75/71/360_F_276757186_K2wS8oG8HhU3cR6k0vQpL8o74712Yj4A.jpg" 
                },
                { id: 4, name: "Desert Honey", unit_price: 55.50, description: "Our premium line of plump, buttery dates with a distinct honeyed finish.", extra_details: "A truly luxurious experience. Each date is plump, moist, and boasts a natural honey flavour. These are graded as our highest quality dates, perfect for special occasions or gifting. Hand-sorted multiple times for guaranteed perfection.", image_url: "https://st4.depositphotos.com/2645851/20036/i/450/depositphotos_200361546-stock-photo-dried-date-fruits-isolated-on.jpg" },
                { id: 5, name: "Sunrise Safawi", unit_price: 35.00, description: "A balanced taste, neither too sweet nor too firm, ideal for everyday enjoyment.", extra_details: "The Safawi date is a staple. It offers great nutritional value and a balanced texture—slightly chewy but smooth. Ideal for inclusion in school lunchboxes or for a quick energy boost during the day. Known for long shelf life.", image_url: "https://c4.wallpaperflare.com/wallpaper/555/442/688/date-palm-fruits-dates-still-life-wallpaper-preview.jpg" },
                { id: 6, name: "Omani Fardh", unit_price: 41.99, description: "Medium-sized and glossy, prized for their rich, dark mahogany colour and nutty flavour.", extra_details: "Hailing from Oman, these dates have a unique, subtly nutty taste and a beautiful dark finish. They hold up well in cooking and are often used in traditional Middle Eastern desserts. High in iron.", image_url: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9k-1y82x2JjQ42yB-4gY_e15O8wF8yFfDLA&s" }
            ],
            footer: {
                shop: [
                    { text: "Full Collection", href: "collection.html" },
                    { text: "Gifting Solutions", href: "gifting.html" }, 
                    { text: "Wholesale Inquiry", href: "bulk.html" } 
                ],
                support: [
                    { text: "FAQ", href: "#" },
                    { text: "Shipping & Returns", href: "#" },
                    { text: "Call", href:"tel:+27728226614"} 
                ],
                social: [
                    { 
                        icon: '<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15V9a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h4l1 3 3-3h6a2 2 0 0 0 2-2z"></path></svg>', 
                        href: "https://wa.me/27728226614?text=I%20have%20an%20inquiry%20about%20your%20premium%20dates." 
                    },
                    { 
                        icon: '<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>', 
                        href: "https://www.instagram.com/thekajoor_square_dates/" 
                    },
                    { icon: "", href: "#" } 
                ]
            }
        };

        // Customizing Tailwind to include our brand colors and fonts
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'date-gold': '#DAA520', 
                        'date-black': '#1E1E1E', 
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'], 
                        display: ['Playfair Display', 'serif'], 
                    },
                }
            }
        };

        // =======================================================
        // 🛒 CART LOGIC (SHARED)
        // =======================================================

        /**
         * Safely parses the cart state from storage.
         * @returns {Object} The cart object (id: quantity).
         */
        function getCart() {
            const cartString = localStorage.getItem('date_cart');
            try {
                return cartString ? JSON.parse(cartString) : {};
            } catch (e) {
                console.error("Error parsing cart data:", e);
                return {};
            }
        }

        /**
         * Saves the cart state to storage.
         * @param {Object} cart The cart object to save.
         */
        function saveCart(cart) {
            localStorage.setItem('date_cart', JSON.stringify(cart));
            updateCartCount();
        }

        /**
         * Updates the cart count displayed in the header.
         */
        function updateCartCount() {
            const cart = getCart();
            const count = Object.values(cart).reduce((sum, quantity) => sum + quantity, 0);
            const badge = document.getElementById('cart-badge');
            if (badge) {
                badge.textContent = count > 99 ? '99+' : count;
                badge.classList.toggle('hidden', count === 0);
            }
        }

        /**
         * Adds an item to the cart and prevents event propagation.
         * @param {number} id - Product ID.
         * @param {Event} event - The click event.
         */
        window.addToCart = function(id, event) {
            // Stop the click event from bubbling up to the parent element (which now opens the modal)
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }

            const cart = getCart();
            const productId = String(id);
            cart[productId] = (cart[productId] || 0) + 1;
            saveCart(cart);

            // Give visual feedback
            showToast(`Added 1 unit of ${getProductById(id).name} to cart!`);
        };
        
        /**
         * Displays a temporary success message (Toast).
         * @param {string} message - The message to display.
         */
        function showToast(message) {
            const toast = document.getElementById('toast-message');
            if (!toast) return;

            toast.textContent = message;
            toast.classList.remove('opacity-0', 'scale-95', 'hidden');
            toast.classList.add('opacity-100', 'scale-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'scale-100');
                toast.classList.add('opacity-0', 'scale-95');
            }, 3000); // Hide after 3 seconds
        }

        // =======================================================
        // 🖼️ PRODUCT MODAL LOGIC (NEW)
        // =======================================================
        
        /**
         * Finds a product by its ID.
         * @param {number} id - The product ID.
         * @returns {Object | undefined} The product object.
         */
        function getProductById(id) {
            // Ensure ID is treated as a number
            return config.products.find(p => p.id === Number(id));
        }

        /**
         * Opens the detailed product modal.
         * @param {number} id - The product ID to display.
         */
        window.openProductDetails = function(id) {
            const product = getProductById(id);
            if (!product) return;

            const modalContent = document.getElementById('modal-content-container');
            if (!modalContent) return;

            // HTML for the modal content
            modalContent.innerHTML = `
                <div class="md:flex md:space-x-8">
                    <!-- Image Column -->
                    <div class="md:w-1/2 mb-6 md:mb-0">
                        <img src="${product.image_url}" alt="${product.name}" class="w-full h-96 object-cover rounded-xl shadow-xl">
                    </div>
                    
                    <!-- Details Column -->
                    <div class="md:w-1/2">
                        <h1 class="font-display text-4xl font-bold text-date-black mb-2">${product.name}</h1>
                        <p class="text-3xl font-semibold text-date-gold mb-4">R ${product.unit_price.toFixed(2)}</p>
                        
                        <!-- Short Description -->
                        <p class="text-lg text-gray-700 mb-6 border-b pb-4">${product.description}</p>
                        
                        <!-- Expanded Details (New "More Mics") -->
                        <h2 class="font-semibold text-xl text-date-black mb-2">The Full Story</h2>
                        <p class="text-gray-600 mb-8">${product.extra_details}</p>
                        
                        <!-- Add to Cart Button for Modal -->
                        <button onclick="addToCart(${product.id}, event); closeProductDetails()" 
                                class="w-full py-3 bg-date-gold text-date-black text-xl font-bold rounded-full shadow-lg hover:bg-date-black hover:text-white transition duration-300 transform active:scale-95 flex items-center justify-center space-x-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
                            <span>Add to Cart</span>
                        </button>
                    </div>
                </div>
            `;

            // Display the modal and block scrolling
            document.getElementById('product-modal').classList.remove('opacity-0', 'invisible');
            document.getElementById('modal-dialog').classList.remove('opacity-0', 'scale-90');
            document.body.classList.add('overflow-hidden');
        };

        /**
         * Closes the detailed product modal.
         */
        window.closeProductDetails = function() {
            // Start closing transition
            document.getElementById('product-modal').classList.add('opacity-0', 'invisible');
            document.getElementById('modal-dialog').classList.add('opacity-0', 'scale-90');
            document.body.classList.remove('overflow-hidden');
        };

        // =======================================================
        // 🔄 RENDERING & INIT FUNCTIONS
        // =======================================================
        
        /**
         * Renders the product cards into the grid.
         */
        function renderProducts() {
            const container = document.getElementById('product-grid');
            if (!container) return;
            
            container.innerHTML = config.products.map(product => `
                <!-- Entire card is clickable to open details modal -->
                <div class="bg-white rounded-xl shadow-lg hover:shadow-2xl transition duration-300 transform hover:scale-[1.02] group cursor-pointer"
                     onclick="openProductDetails(${product.id})">
                    
                    <div class="relative overflow-hidden rounded-t-xl h-64">
                        <img src="${product.image_url}" alt="${product.name}" class="w-full h-full object-cover transition duration-500 group-hover:scale-105">
                        <div class="absolute top-0 right-0 bg-date-gold/90 text-date-black font-bold p-2 px-4 rounded-bl-xl shadow-md text-xl">
                            R ${product.unit_price.toFixed(2)}
                        </div>
                    </div>
                    
                    <div class="p-6">
                        <h3 class="font-display text-2xl font-bold text-date-black mb-2">${product.name}</h3>
                        <p class="text-gray-600 mb-4 h-12 overflow-hidden text-ellipsis">${product.description}</p>
                        
                        <!-- Add to Cart Button -->
                        <button onclick="addToCart(${product.id}, event)" 
                                class="w-full py-3 bg-date-black text-white font-semibold rounded-full hover:bg-date-gold hover:text-date-black transition duration-300 transform active:scale-95 shadow-md">
                            Add to Cart (1 unit)
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Helper functions for rendering header/footer
        function renderListLinks(containerId, links) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = links.map(link => 
                `<li><a href="${link.href}" class="hover:text-date-gold transition">${link.text}</a></li>`
            ).join('');
        }

        function renderSocialLinks(containerId, links) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = links.map(link => 
                `<a href="${link.href}" target="_blank" class="text-date-gold hover:text-white transition duration-300 p-2 rounded-full hover:bg-date-gold/20 flex items-center justify-center">
                    ${link.icon}
                </a>`
            ).join('');
        }

        function renderContent() {
            // Header Logo
            const brandLogo = document.getElementById('brand-logo');
            if (brandLogo) {
                brandLogo.innerHTML = `<span class="text-date-gold">${config.brand.gold_part}</span> ${config.brand.black_part}`;
            }

            // Navigation Links (Updated for consistency)
            const navLinks = `
                <a href="index.html" onclick="closeMobileMenu()" class="text-date-black hover:text-date-gold transition duration-200">Home</a>
                <a href="collection.html" onclick="closeMobileMenu()" class="text-date-gold font-bold transition duration-200">Collection</a>
                <a href="gifting.html" onclick="closeMobileMenu()" class="text-date-black hover:text-date-gold transition duration-200">Gifting</a>
                <a href="about.html" onclick="closeMobileMenu()" class="text-date-black hover:text-date-gold transition duration-200">Our Story</a>
                <a href="bulk.html" onclick="closeMobileMenu()" class="text-date-black hover:text-date-gold transition duration-200">Wholesale</a>
                <a href="cart.html" onclick="closeMobileMenu()" class="text-date-black hover:text-date-gold transition duration-200">Cart</a>
            `;
            
            document.getElementById('main-nav').innerHTML = navLinks;
            document.getElementById('mobile-nav').innerHTML = navLinks;

            // Footer Content
            document.getElementById('footer-brand-name').textContent = config.brand.name;
            document.getElementById('footer-established').textContent = `Distributers of the Finest Dates since ${config.brand.established_year}.`;
            
            const footerAddress = document.getElementById('footer-address');
            if (footerAddress) {
                 footerAddress.innerHTML = `
                    <a href="${config.brand.address.href}" target="_blank" class="hover:text-date-gold transition duration-200">
                        ${config.brand.address.text}
                    </a>
                `;
            }

            document.getElementById('footer-copyright').textContent = `© 2025 ${config.brand.name} All Rights Reserved.`;

            renderListLinks('footer-shop-links', config.footer.shop);
            renderListLinks('footer-support-links', config.footer.support);
            renderSocialLinks('footer-social-links', config.footer.social);
            
            // Render Products and update cart count
            renderProducts();
            updateCartCount();
        }

        // === Mobile Menu Logic ===
        function openMobileMenu() {
            document.getElementById('mobile-menu').classList.remove('hidden');
            document.body.classList.add('overflow-hidden');
        }

        function closeMobileMenu() {
            document.getElementById('mobile-menu').classList.add('hidden');
            document.body.classList.remove('overflow-hidden');
        }

        function setupMobileMenu() {
            document.getElementById('menu-button').onclick = openMobileMenu;
            document.getElementById('close-menu-button').onclick = closeMobileMenu;
        }

        window.onload = function() {
            renderContent();
            setupMobileMenu();
        };

    </script>
    <style>
        /* Custom styles for gold/black theme */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #DAA520; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8860c; }
        
        /* Modal Backdrop Styling */
        #product-modal {
            transition: opacity 0.3s ease-out;
            z-index: 50; /* Ensure it's above everything */
        }
        /* Modal Dialog Styling for scale transition */
        #modal-dialog {
            transition: opacity 0.3s ease-out, transform 0.3s ease-out;
        }
    </style>
</head>
<body class="bg-date-black/5 text-date-black font-sans antialiased min-h-screen flex flex-col">

    <!-- Toast Message (Non-blocking alert) -->
    <div id="toast-message" class="fixed bottom-6 right-6 p-4 bg-date-black text-white font-semibold rounded-lg shadow-xl transition-all duration-500 transform opacity-0 scale-95 hidden z-50">
        <!-- Message content injected by showToast() -->
    </div>

    <!-- Mobile Menu Overlay -->
    <div id="mobile-menu" class="hidden fixed inset-0 z-50 bg-date-black/95 backdrop-blur-md">
        <div class="flex flex-col h-full items-center justify-center space-y-8">
            <button id="close-menu-button" class="absolute top-6 right-6 text-date-gold hover:text-white transition" aria-label="Close Menu">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <nav id="mobile-nav" class="flex flex-col space-y-6 text-3xl font-display font-bold text-white text-center">
                <!-- Mobile Links dynamically updated in JS renderContent() -->
            </nav>
        </div>
    </div>
    
    <!-- Header & Navigation -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-sm shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <!-- Logo/Brand Name -->
            <a href="index.html" class="text-3xl font-display font-bold text-date-black tracking-wider" id="brand-logo">
                <!-- Content injected by JavaScript -->
            </a>
            
            <!-- Desktop Navigation -->
            <nav id="main-nav" class="hidden md:flex space-x-8 text-lg font-medium">
                <!-- Links dynamically updated in JS renderContent() -->
            </nav>

            <!-- Actions (Cart & Mobile Menu Button) -->
            <div class="flex items-center space-x-4">
                <!-- Cart Icon -->
                <a href="cart.html" class="p-2 text-date-gold transition duration-200 relative" aria-label="Shopping Cart">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                    <!-- Cart Badge -->
                    <span id="cart-badge" class="absolute top-1 right-1 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/2 -translate-y-1/2 bg-date-gold rounded-full hidden">0</span>
                </a>
                
                <!-- Mobile Menu Button (Hamburger) -->
                <button id="menu-button" class="md:hidden text-date-black p-2 rounded-lg hover:bg-date-black/10 transition" aria-label="Open Menu">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
            </div>
            
        </div>
    </header>

    <main class="flex-grow py-12 md:py-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <header class="text-center mb-12">
                <h1 class="font-display text-6xl font-extrabold text-date-black mb-4">
                    The Exclusive Date Collection
                </h1>
                <p class="text-xl text-gray-600 max-w-3xl mx-auto">
                    Explore our hand-selected varieties of premium dates from around the world. Each one is a promise of quality and exceptional taste.
                </p>
            </header>

            <!-- Product Grid -->
            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10">
                <!-- Products dynamically rendered here -->
            </div>

        </div>
    </main>

    <!-- Product Details Modal (Overlay) -->
    <div id="product-modal" class="fixed inset-0 bg-date-black/70 backdrop-blur-sm flex justify-center items-center p-4 opacity-0 invisible transition duration-300 z-50" onclick="closeProductDetails()">
        <div id="modal-dialog" class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[90vh] overflow-y-auto p-6 md:p-10 transform scale-90 opacity-0 transition duration-300" onclick="event.stopPropagation()">
            
            <!-- Close Button -->
            <button onclick="closeProductDetails()" class="absolute top-4 right-4 text-gray-500 hover:text-date-black transition" aria-label="Close Product Details">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>

            <!-- Modal Content Injected Here -->
            <div id="modal-content-container" class="mt-4">
                <!-- Product details will be dynamically loaded here by JavaScript -->
                <p class="text-center text-gray-500">Loading product details...</p>
            </div>
        </div>
    </div>


    <!-- Footer -->
    <footer class="bg-date-black text-white py-12 mt-auto border-t-4 border-date-gold">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-8">
                
                <!-- Brand Info -->
                <div>
                    <h3 id="footer-brand-name" class="font-display text-2xl font-bold text-date-gold mb-4"><!-- Content injected by JavaScript --></h3>
                    <p id="footer-established" class="text-gray-400 text-sm mb-2"><!-- Content injected by JavaScript --></p>
                    <p id="footer-address" class="text-gray-400 text-sm"><!-- Content injected by JavaScript --></p>
                </div>

                <!-- Links - Shop -->
                <div>
                    <h4 class="text-lg font-semibold mb-3">Shop</h4>
                    <ul id="footer-shop-links" class="space-y-2 text-sm text-gray-400">
                        <!-- Links dynamically generated by JS -->
                    </ul>
                </div>

                <!-- Links - Support -->
                <div>
                    <h4 class="text-lg font-semibold mb-3">Support</h4>
                    <ul id="footer-support-links" class="space-y-2 text-sm text-gray-400">
                        <!-- Links dynamically generated by JS -->
                    </ul>
                </div>
                
                <!-- Social -->
                <div>
                    <h4 class="text-lg font-semibold mb-3">Connect</h4>
                    <div id="footer-social-links" class="flex space-x-4">
                        <!-- Links dynamically generated by JS -->
                    </div>
                </div>
            </div>

            <div class="mt-10 pt-6 border-t border-gray-700 text-center">
                <p id="footer-copyright" class="text-sm text-gray-500"><!-- Content injected by JavaScript --></p>
            </div>
        </div>
    </footer>

</body>
</html>
